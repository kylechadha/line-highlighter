name: Release Please

on:
  push:
    branches:
      - master
  # Manual retry of the Chrome Web Store publish for the latest GitHub release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          target-branch: master
          config-file: release-please-config.json

      # The following steps only run if a release was created
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      - name: Build and attach extension zip
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          npm run build
          gh release upload "$TAG" build/*.zip --clobber

  sync-develop:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward develop to master
        run: |
          git checkout -B develop origin/develop
          git merge --ff-only origin/master
          git push origin develop

  publish-chrome-store:
    needs: release-please
    # !cancelled() lets the manual retry run while release-please is skipped
    if: |
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
      (needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publish the exact zip attached to the release; the manual retry uses the latest release
      - name: Download release zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release download ${TAG:+"$TAG"} --pattern '*.zip' --dir build

      - name: Upload and publish to Chrome Web Store
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: ./scripts/publish-chrome-store.sh build/*.zip
